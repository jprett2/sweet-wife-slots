<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="turtle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#06231b" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="turtle-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98a"/>
      <stop offset="0.55" stop-color="#e9b45a"/>
      <stop offset="1" stop-color="#b97b2c"/>
    </linearGradient>
    <linearGradient id="turtle-flipper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.6" stop-color="#dba04a"/>
      <stop offset="1" stop-color="#a86a24"/>
    </linearGradient>
    <radialGradient id="turtle-head" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffe2a0"/>
      <stop offset="0.6" stop-color="#e8b057"/>
      <stop offset="1" stop-color="#b47426"/>
    </radialGradient>
    <radialGradient id="turtle-rim" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#b8662c"/>
      <stop offset="1" stop-color="#6a2e10"/>
    </radialGradient>
    <radialGradient id="turtle-shell" cx="0.38" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#e5934a"/>
      <stop offset="0.55" stop-color="#b8602a"/>
      <stop offset="1" stop-color="#7c3614"/>
    </radialGradient>
    <radialGradient id="turtle-scute" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#f4ab5c"/>
      <stop offset="1" stop-color="#c06a2c"/>
    </radialGradient>
  </defs>

  <g filter="url(#turtle-shadow)" stroke="#2e1408" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <!-- rear flippers -->
    <path d="M186 376 C156 392 126 416 108 442 C128 452 162 446 192 428 C212 414 222 398 220 384 Z" fill="url(#turtle-flipper)"/>
    <path d="M326 376 C356 392 386 416 404 442 C384 452 350 446 320 428 C300 414 290 398 292 384 Z" fill="url(#turtle-flipper)"/>
    <!-- tail -->
    <path d="M242 424 L256 462 L270 424 Z" fill="url(#turtle-skin)"/>
    <!-- front flippers -->
    <path d="M190 206 C150 176 98 150 56 150 C38 150 34 166 46 178 C80 212 128 246 174 266 C192 250 200 226 190 206 Z" fill="url(#turtle-flipper)"/>
    <path d="M322 206 C362 176 414 150 456 150 C474 150 478 166 466 178 C432 212 384 246 338 266 C320 250 312 226 322 206 Z" fill="url(#turtle-flipper)"/>
    <!-- neck and head -->
    <path d="M224 150 C224 136 288 136 288 150 L292 200 L220 200 Z" fill="url(#turtle-skin)"/>
    <ellipse cx="256" cy="106" rx="56" ry="56" fill="url(#turtle-head)"/>
  </g>

  <!-- flipper scale spots -->
  <g fill="#9a5a1c" opacity="0.55">
    <ellipse cx="92" cy="170" rx="12" ry="8" transform="rotate(25 92 170)"/>
    <ellipse cx="128" cy="196" rx="13" ry="9" transform="rotate(30 128 196)"/>
    <ellipse cx="160" cy="224" rx="11" ry="8" transform="rotate(35 160 224)"/>
    <ellipse cx="420" cy="170" rx="12" ry="8" transform="rotate(-25 420 170)"/>
    <ellipse cx="384" cy="196" rx="13" ry="9" transform="rotate(-30 384 196)"/>
    <ellipse cx="352" cy="224" rx="11" ry="8" transform="rotate(-35 352 224)"/>
    <ellipse cx="148" cy="430" rx="9" ry="7"/>
    <ellipse cx="364" cy="430" rx="9" ry="7"/>
  </g>
  <!-- flipper leading-edge highlights -->
  <path d="M62 160 C100 160 140 178 176 202" fill="none" stroke="#fff4d6" stroke-width="7" stroke-linecap="round" opacity="0.7"/>
  <path d="M450 160 C412 160 372 178 336 202" fill="none" stroke="#fff4d6" stroke-width="7" stroke-linecap="round" opacity="0.7"/>

  <!-- head plates, eyes, smile -->
  <path d="M234 70 L256 60 L278 70 L272 90 L240 90 Z" fill="#d79a44" stroke="#7a4214" stroke-width="5" stroke-linejoin="round"/>
  <path d="M240 90 L272 90 L266 108 L246 108 Z" fill="#dfa64e" stroke="#7a4214" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="214" cy="104" rx="16" ry="18" fill="#1b1020"/>
  <ellipse cx="298" cy="104" rx="16" ry="18" fill="#1b1020"/>
  <circle cx="209" cy="97" r="6.5" fill="#ffffff"/>
  <circle cx="293" cy="97" r="6.5" fill="#ffffff"/>
  <path d="M232 130 Q256 146 280 130" fill="none" stroke="#2e1408" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="232" cy="72" rx="15" ry="8" fill="#ffffff" opacity="0.55" transform="rotate(-30 232 72)"/>

  <!-- shell -->
  <g transform="translate(0 12)">
  <ellipse cx="256" cy="288" rx="122" ry="144" fill="url(#turtle-rim)" stroke="#2e1408" stroke-width="12" filter="url(#turtle-shadow)"/>
  <!-- marginal scute lines -->
  <path d="M346 311L375 318M330 354L355 373M302 385L317 413M266 399L269 431M228 395L218 425M194 371L174 395M172 334L145 347M164 288L134 288M172 242L145 229M194 205L174 181M228 181L218 151M266 177L269 145M302 191L317 163M330 222L355 203M346 265L375 258" fill="none" stroke="#3a1a0a" stroke-width="6" stroke-linecap="round"/>

  <!-- main carapace -->
  <ellipse cx="256" cy="288" rx="94" ry="114" fill="url(#turtle-shell)" stroke="#3a1a0a" stroke-width="7"/>
  <!-- costal divisions -->
  <path d="M226 238 L166 232 M222 290 L162 296 M228 342 L176 366 M286 238 L346 232 M290 290 L350 296 M284 342 L336 366" fill="none" stroke="#3a1a0a" stroke-width="7" stroke-linecap="round"/>
  <!-- vertebral scutes -->
  <g stroke="#3a1a0a" stroke-width="7" stroke-linejoin="round" fill="url(#turtle-scute)">
    <path d="M232 186 L280 186 L294 212 L286 238 L226 238 L218 212 Z"/>
    <path d="M226 238 L286 238 L298 264 L290 290 L222 290 L214 264 Z"/>
    <path d="M222 290 L290 290 L298 316 L284 342 L228 342 L214 316 Z"/>
    <path d="M228 342 L284 342 L290 368 L256 400 L222 368 Z"/>
  </g>
  <!-- glossy highlights -->
  <path d="M190 228 C196 196 222 180 250 178 C232 192 214 214 206 246 C200 254 186 246 190 228 Z" fill="#ffffff" opacity="0.5"/>
  <ellipse cx="300" cy="200" rx="10" ry="6" fill="#ffffff" opacity="0.45" transform="rotate(30 300 200)"/>
  </g>
</svg>
